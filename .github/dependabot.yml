version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
  # The Marketing OS slide-deck generator is the only npm project in the repo.
  # Watch it so security updates get real, tested fix PRs (previously only
  # github-actions was covered, so npm advisories went unaddressed).
  - package-ecosystem: "npm"
    directory: "/docs/presentations/marketing-os"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(npm)"
    open-pull-requests-limit: 10
