name: Graphify Knowledge Graph

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the repository before indexing
        run: bash scripts/preflight.sh
      - name: Install pinned knowledge-build dependencies
        run: python -m pip install -r scripts/requirements-knowledge.txt
      - name: Test graph and wiki exports
        run: python -m unittest discover -s tests/knowledge -v
      - name: Build tracked, company-neutral knowledge only
        env:
          REPOSITORY: ${{ github.repository }}
        run: python scripts/build_knowledge.py --repository "$REPOSITORY"
      - name: Upload graph and wiki artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketing-brain-knowledge
          path: |
            graphify-out/ci/graph.json
            graphify-out/ci/graph.html
            graphify-out/ci/GRAPH_REPORT.md
            graphify-out/ci/build-info.json
            graphify-out/ci/wiki/*.md
          if-no-files-found: error
          retention-days: 14
      - name: Describe the result
        run: |
          {
            echo '## Marketing Brain knowledge build'
            echo 'Download **marketing-brain-knowledge** from this run for the interactive graph, JSON, report, and wiki pages.'
            echo 'This is a structural build with no LLM calls. Private local profiles, reports, Git history, and generated Codex mirrors are excluded.'
            echo 'Artifacts expire after 14 days. Re-run this workflow to regenerate them.'
            echo '```json'
            cat graphify-out/ci/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
