name: Codex Sync on Merge

# Keeps the generated Codex port (AGENTS.md + .agents/skills/) in sync with the
# Claude source of truth AFTER every merge to main - the same on-merge, commit-back
# pattern the Wiki + Graph Sync workflow uses for graphify-out/.
#
# Why on-merge and not only the per-PR codex-sync-check: the PR check keeps an
# individual PR honest, but it cannot catch MERGE-ORDER drift. When PR-A and PR-B
# both touch .claude/skills, whichever merges second lands with an .agents mirror
# generated before the first one's changes. That is exactly what happened with
# #232/#233 and needed a manual catch-up. This job makes main self-heal: it
# regenerates from main's own .claude/ and commits any delta back. No model, no
# secret - scripts/sync-codex.py is deterministic.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize with itself so two rapid merges don't race on the push to main.
  group: codex-sync-on-merge-main
  cancel-in-progress: false

jobs:
  codex-sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate the Codex port
        run: python3 scripts/sync-codex.py

      - name: Commit and push if the port drifted
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "doc-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only AGENTS.md and .agents/ are generated; refuse to commit anything else.
          if [ -z "$(git status --porcelain AGENTS.md .agents)" ]; then
            echo "Codex port already in sync. Nothing to commit."
            exit 0
          fi
          offending=$(git status --porcelain | awk '{print $2}' | grep -vE '^(AGENTS\.md|\.agents/)' || true)
          if [ -n "$offending" ]; then
            echo "sync-codex.py touched unexpected paths; refusing to commit:" >&2
            echo "$offending" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            msg="chore(codex): sync Codex port after PR #${PR_NUMBER}"
          else
            msg="chore(codex): manual Codex port reconciliation"
          fi
          git add AGENTS.md .agents
          git commit -m "$msg"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Codex port updated on main."
