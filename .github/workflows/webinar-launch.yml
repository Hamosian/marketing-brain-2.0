name: Webinar Launch

# One-click webinar setup for anyone with write access to this repo.
#
# Why this runs here and not on a laptop: the pipeline used to be Node scripts plus a
# gitignored .env, so exactly one person could run it and the config entry for a launched
# webinar lived only in that person's worktree. Repo secrets move the credentials to one
# place, every collaborator gets the same button, and the config entry is committed back to
# main by the job itself.
#
# The hard rule the scripts enforce and this workflow does not relax: a flow is always
# created DISABLED. Turning it on stays a human decision in the HubSpot UI.

on:
  workflow_dispatch:
    inputs:
      event:
        description: 'Riverside registration link, or the bare 24-hex event ID'
        required: true
        type: string
      mode:
        description: 'plan = dry run | create = draft emails, lists and the disabled workflow | publish = publishes the emails (turn the workflow on only after this)'
        required: true
        default: plan
        type: choice
        options: [plan, create, publish]
      seed_form:
        description: 'Optional: HubSpot form GUID to clone instead of the most recent webinar form'
        required: false
        type: string
      expected_start:
        description: 'Optional: the start time the requestor gave, ISO 8601 (e.g. 2026-10-22T16:00:00Z). The run stops if Riverside disagrees.'
        required: false
        type: string
      email_copy:
        description: 'Optional: approved email copy (the emailCopy JSON from /launch-webinar), base64-encoded'
        required: false
        type: string
      join_link_fallback:
        description: 'Optional: shared studio audience link, used when a registrant has no personal join link yet'
        required: false
        type: string
      force_copy:
        description: 'Overwrite draft emails that someone edited in HubSpot since the last copy update'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # config/webinars.json is committed back, so two launches must not race on it.
  group: webinar-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Verify the HubSpot token points at portal 9154210
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: |
          if [ -z "$HUBSPOT_PRIVATE_APP_TOKEN" ]; then
            echo "::error::HUBSPOT_PRIVATE_APP_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          portal=$(curl -sS -H "Authorization: Bearer $HUBSPOT_PRIVATE_APP_TOKEN" \
            https://api.hubapi.com/account-info/v3/details | node -e \
            'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(String(JSON.parse(d).portalId||""))}catch{process.stdout.write("")}})')
          if [ "$portal" != "9154210" ]; then
            echo "::error::HubSpot token resolves to portal '${portal:-unknown}', expected 9154210. Refusing to write."
            exit 1
          fi
          echo "HubSpot token OK (portal $portal)."

      - name: Resolve the event and write its config entry
        id: intake
        working-directory: tools/webinar-automation
        env:
          EVENT_INPUT: ${{ inputs.event }}
          EXPECTED_START: ${{ inputs.expected_start }}
          EMAIL_COPY_B64: ${{ inputs.email_copy }}
          JOIN_FALLBACK: ${{ inputs.join_link_fallback }}
        run: |
          args=("$EVENT_INPUT" --emit-env "$GITHUB_OUTPUT")
          if [ -n "$EXPECTED_START" ]; then args+=(--expect-start "$EXPECTED_START"); fi
          if [ -n "$JOIN_FALLBACK" ]; then args+=(--join-fallback "$JOIN_FALLBACK"); fi
          if [ -n "$EMAIL_COPY_B64" ]; then
            # Decoded by node rather than base64(1) so wrapped or unwrapped input both work.
            copy_file="$RUNNER_TEMP/email-copy.json"
            node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.EMAIL_COPY_B64, "base64").toString("utf8"))' "$copy_file"
            args+=(--copy-file "$copy_file")
          fi
          node scripts/add-webinar.js "${args[@]}"

      - name: Registration form and intake list
        working-directory: tools/webinar-automation
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          EVENT_ID: ${{ steps.intake.outputs.WEBINAR_EVENT_ID }}
          SEED_FORM: ${{ inputs.seed_form }}
          MODE: ${{ inputs.mode }}
        run: |
          args=("$EVENT_ID")
          if [ "$MODE" != "plan" ]; then args+=(--create); fi
          if [ -n "$SEED_FORM" ]; then args+=(--seed-form "$SEED_FORM"); fi
          node scripts/ensure-hubspot-intake.js "${args[@]}"

      - name: Emails, workflow and lists
        working-directory: tools/webinar-automation
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          EVENT_ID: ${{ steps.intake.outputs.WEBINAR_EVENT_ID }}
          MODE: ${{ inputs.mode }}
          FORCE_COPY: ${{ inputs.force_copy }}
        run: |
          args=("$EVENT_ID")
          if [ "$MODE" != "plan" ]; then args+=(--create); fi
          if [ "$MODE" = "publish" ]; then args+=(--publish-emails); fi
          if [ "$FORCE_COPY" = "true" ]; then args+=(--force-copy); fi
          node scripts/new-webinar.js "${args[@]}"

      - name: Commit the config entry back to main
        if: ${{ inputs.mode != 'plan' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ID: ${{ steps.intake.outputs.WEBINAR_EVENT_ID }}
        run: |
          if [ -z "$(git status --porcelain tools/webinar-automation/config/webinars.json)" ]; then
            echo "Config unchanged. Nothing to commit."
            exit 0
          fi
          # config/webinars.json is the only file this job may write.
          offending=$(git status --porcelain | awk '{print $2}' | grep -v '^tools/webinar-automation/config/webinars\.json$' || true)
          if [ -n "$offending" ]; then
            echo "::error::Unexpected paths modified; refusing to commit:"
            echo "$offending"
            exit 1
          fi
          git config user.name "webinar-launch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/webinar-automation/config/webinars.json
          git commit -m "chore(webinar): config entry for event ${EVENT_ID} (launched by @${{ github.actor }})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: What is left for a human
        if: ${{ always() && inputs.mode != 'plan' }}
        env:
          MODE: ${{ inputs.mode }}
          EVENT_ID: ${{ steps.intake.outputs.WEBINAR_EVENT_ID }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Webinar launch: over to you, @${ACTOR}"
            echo ""
            echo "You launched it, so these are yours. Nothing below happens on its own."
            echo ""
            echo "1. QA the three emails in HubSpot (copy, links, the join-URL token). Send a test of a reminder to a contact with no personal join link, to see what that button does. Any line in this run's log reading \"copy NOT updated\" names an email that kept its old copy."
            if [ "$MODE" = "create" ]; then
              # The flow exists, disabled, on draft emails. Publishing comes first, then a person turns it on.
              echo "2. **The reminder workflow exists, disabled, pointing at the draft emails.** Do not turn it on yet. Once the copy is approved, re-run this workflow with \`mode=publish\` to publish the emails; only then turn the workflow on."
              echo "3. Draft the Webflow landing page: \`/launch-webinar\` does it in your Claude session once this run has committed the form ID to main. Then preview it and publish it yourself."
            else
              echo "2. Check the workflow's enrollment triggers and reminder timestamps."
              echo "3. **Turn the workflow ON.** It is created disabled every time, by design. Until you flip it, nobody receives anything."
              echo "4. Preview and publish the Webflow landing page draft (agents never publish)."
            fi
            echo ""
            echo "Event ID: \`${EVENT_ID}\` (mode: \`${MODE}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
