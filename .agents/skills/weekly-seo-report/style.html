<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0F0F14; --surface:#16161D; --surface-2:#1C1C24; --line:#2A2A35; --line-soft:#22222C;
  --accent:#7C5CFF; --accent-soft:rgba(124,92,255,.13);
  --ink:#FFFFFF; --ink-2:#E6E6EB; --ink-3:#8E8E9E; --ink-4:#63636F;
  --pos:#3DBE8B; --neg:#E8595C; --caution:#D9A13B;
  --pos-bg:rgba(61,190,139,.12); --neg-bg:rgba(232,89,92,.12); --flat-bg:rgba(142,142,158,.14);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:40px 28px 72px; display:flex; flex-direction:column; gap:44px}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

/* masthead */
.mast{display:flex; flex-direction:column; gap:22px}
.mast-top{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap}
.logo{height:26px; width:auto; display:block}
.mast h1{
  margin:0; font-size:clamp(27px,3.4vw,38px); font-weight:700; letter-spacing:-.025em;
  text-wrap:balance; line-height:1.12;
}
.mast .sub{margin:0; color:var(--ink-3); font-size:15px; max-width:66ch}
.eyebrow{
  font-size:11px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  color:var(--accent); margin:0 0 9px;
}
.fresh{
  display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); overflow:hidden;
}
.fresh div{padding:13px 20px; flex:1 1 190px; border-right:1px solid var(--line-soft)}
.fresh div:last-child{border-right:0}
.fresh dt{font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-4); margin:0 0 4px}
.fresh dd{margin:0; font-size:14px; font-weight:600; color:var(--ink-2)}
.ok{color:var(--pos)}

/* sections */
section{display:flex; flex-direction:column; gap:18px}
h2{
  margin:0; font-size:20px; font-weight:600; letter-spacing:-.015em;
  padding-left:13px; border-left:3px solid var(--accent);
}
.lede{margin:0; color:var(--ink-3); font-size:14.5px; max-width:82ch}
.window-note{
  font-size:13px; color:var(--ink-3); background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:11px 16px; display:flex; gap:8px; flex-wrap:wrap; align-items:baseline;
}
.window-note b{color:var(--ink-2); font-weight:600}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:14px}
.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:17px 19px 19px; display:flex; flex-direction:column; gap:7px;
}
.tile .k{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-4)}
.tile .v{font-size:29px; font-weight:700; letter-spacing:-.03em; line-height:1}
.tile .foot{display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-3)}
.chip{
  display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.chip-up{background:var(--pos-bg); color:var(--pos)}
.chip-dn{background:var(--neg-bg); color:var(--neg)}
.chip-flat,.chip-new{background:var(--flat-bg); color:var(--ink-3)}

/* tables */
.scroll{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:right; padding:10px 14px; white-space:nowrap}
th:first-child,td:first-child{text-align:left; white-space:normal}
thead th{
  font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-4); background:var(--surface-2); border-bottom:1px solid var(--line);
  position:sticky; top:0;
}
thead tr.grp th{
  color:var(--ink-3); border-bottom:1px solid var(--line-soft); text-align:center;
  letter-spacing:.1em; background:var(--surface-2);
}
thead tr.grp th.gsep{border-left:1px solid var(--line)}
tbody td{border-bottom:1px solid var(--line-soft); color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(124,92,255,.05)}
td.gsep{border-left:1px solid var(--line)}
tbody td.lead{color:var(--ink); font-weight:600}
tfoot td{
  border-top:1px solid var(--line); background:var(--surface-2);
  font-weight:600; color:var(--ink); font-size:13px;
}
.rank{color:var(--ink-4); font-variant-numeric:tabular-nums; padding-right:9px; font-size:12px}
code.path{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
  color:var(--ink); background:rgba(124,92,255,.09); border:1px solid rgba(124,92,255,.2);
  padding:1.5px 6px; border-radius:5px;
}
.flagdot{
  display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--caution);
  margin-left:7px; vertical-align:middle;
}
.ch-name{display:flex; align-items:center; gap:9px}
.ch-rail{width:3px; height:15px; border-radius:2px; flex:0 0 auto}

/* findings */
.finds{display:flex; flex-direction:column; gap:14px}
.find{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:0; overflow:hidden; display:flex;
}
.find .stripe{width:4px; flex:0 0 4px}
.find .body{padding:17px 20px 18px; display:flex; flex-direction:column; gap:9px}
.find h3{margin:0; font-size:15.5px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:11px; flex-wrap:wrap}
.sev{
  font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  padding:3px 8px; border-radius:5px;
}
.sev-1{background:var(--neg-bg); color:var(--neg)}
.sev-2{background:rgba(217,161,59,.14); color:var(--caution)}
.sev-3{background:var(--accent-soft); color:#A78FFF}
.find p{margin:0; color:var(--ink-2); font-size:14px; max-width:88ch}
.find p.mut{color:var(--ink-3); font-size:13.5px}
.find b{color:var(--ink); font-weight:600}
.find ul{margin:2px 0 0; padding-left:19px; color:var(--ink-2); font-size:13.5px; display:flex; flex-direction:column; gap:5px}

/* footer */
footer{border-top:1px solid var(--line); padding-top:24px; display:flex; flex-direction:column; gap:14px}
footer p{margin:0; color:var(--ink-4); font-size:12.5px; max-width:92ch; line-height:1.6}
footer .sql{color:var(--ink-3)}
footer code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; color:var(--ink-3)}
@media (max-width:640px){
  .wrap{padding:28px 16px 56px; gap:34px}
  .tile .v{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
