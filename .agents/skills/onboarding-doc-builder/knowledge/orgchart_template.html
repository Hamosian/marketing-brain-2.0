<!doctype html>
<!--
  Org chart for an onboarding doc. Edit ORG below, then render from the repo root:
    scripts/web_screenshot.sh <this file> <out>.png 1600 560 2
  and crop the empty margin with `sips -c <h> <w> --cropOffset <y> <x>`.

  One row per level. kind: "dark" = the reporting chain from the VP down to the hire's manager,
  "dim" = context (peers of the chain), "accent" = the hire's own team, "you" = the hire,
  "external" = an agency or contractors (dashed). links: [parent id, [child ids]].
  Filled in with the 2026-09 Marketing Operations example; replace it for the next hire.
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--p:#7C5CFF;--nb:#0F0F14;--lg:#E6E6EB;--pm:#F7F5FF;--pmed:#B8A5FF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1600px;background:#fff;font-family:"Instrument Sans",Arial,sans-serif;color:var(--nb);padding:36px 40px 40px}
  .row{display:flex;justify-content:center;gap:18px}
  .gap{height:46px}
  .node{border-radius:9999px;padding:14px 22px;text-align:center;min-width:180px;background:#fff;border:1.5px solid var(--lg)}
  .node b{display:block;font-size:19px;font-weight:600;letter-spacing:-0.01em}
  .node span{display:block;font-size:14px;color:#55556a;margin-top:2px}
  .dark{background:var(--nb);border-color:var(--nb);color:#fff}.dark span{color:var(--lg)}
  .dim{opacity:.55}
  .accent{border:2px solid var(--p);background:var(--pm)}
  .external{border:2px dashed var(--p);background:var(--pm)}
  .you{background:var(--p);border-color:var(--p);color:#fff}.you span{color:#fff}
  svg{position:absolute;left:0;top:0;pointer-events:none}
</style></head>
<body>
<div id="wrap" style="position:relative"></div>
<script>
const ORG = {
  rows: [
    [{id: "vp", name: "Abel Grünfeld", role: "VP Marketing", kind: "dark"}],
    [{id: "john", name: "John Tay", role: "AI Marketing", kind: "dim"},
     {id: "razm", name: "Raz Messing", role: "Brand", kind: "dim"},
     {id: "nir", name: "Nir Taranto", role: "Growth Marketing", kind: "dark"},
     {id: "sivan", name: "Sivan Mazuz", role: "Marketing (PMM, content, community)", kind: "dim"},
     {id: "ruben", name: "Ruben Aknin", role: "Growth Initiatives", kind: "dim"}],
    [{id: "erika", name: "Erika Varangouli", role: "SEO & AI Search", kind: "dim"},
     {id: "razn", name: "Raz Navon", role: "Paid Acquisition", kind: "dim"},
     {id: "hanan", name: "Hanan Amos", role: "Marketing Operations", kind: "accent"},
     {id: "savion", name: "Savion Ron Shemesh", role: "Creator Marketing, Growth Channels", kind: "dim"}],
    [{id: "galili", name: "Jonathan Galili", role: "Marketing Tech", kind: "accent"},
     {id: "hire", name: "Jonathan Ydov (you)", role: "Marketing Website", kind: "you"},
     {id: "agency", name: "Flow Ninja (Webflow agency)", role: "Milutin, Dusan; lead: Djura", kind: "external"}],
  ],
  links: [["vp", ["john", "razm", "nir", "sivan", "ruben"]],
          ["nir", ["erika", "razn", "hanan", "savion"]],
          ["hanan", ["galili", "hire", "agency"]]],
};

const wrap = document.getElementById("wrap");
ORG.rows.forEach((row, i) => {
  if (i) { const g = document.createElement("div"); g.className = "gap"; wrap.appendChild(g); }
  const r = document.createElement("div"); r.className = "row";
  row.forEach(n => {
    const el = document.createElement("div");
    el.className = "node " + n.kind; el.id = n.id;
    el.innerHTML = `<b></b><span></span>`;
    el.querySelector("b").textContent = n.name; el.querySelector("span").textContent = n.role;
    r.appendChild(el);
  });
  wrap.appendChild(r);
});
const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
wrap.appendChild(svg);
svg.setAttribute("width", wrap.offsetWidth); svg.setAttribute("height", wrap.offsetHeight);
const box = id => { const e = document.getElementById(id).getBoundingClientRect(), w = wrap.getBoundingClientRect();
  return {x: e.left - w.left + e.width / 2, top: e.top - w.top, bot: e.bottom - w.top}; };
let d = "";
for (const [parent, kids] of ORG.links) {
  const a = box(parent), ks = kids.map(box), mid = (a.bot + ks[0].top) / 2, xs = ks.map(k => k.x);
  d += `M${a.x},${a.bot}V${mid}M${Math.min(...xs)},${mid}H${Math.max(...xs)}`;
  ks.forEach(k => { d += `M${k.x},${mid}V${k.top}`; });
}
svg.innerHTML = `<path d="${d}" fill="none" stroke="#B8A5FF" stroke-width="2"/>`;
</script>
</body></html>
